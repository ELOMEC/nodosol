name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "2.2.21"
  ANCHOR_TAG: "v1.0.0"

jobs:
  rust:
    name: Anchor build + program tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pin toolchain to the channel in rust-toolchain.toml.
      # dtolnay/rust-toolchain doesn't support a toolchain-file input.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Install Solana CLI directly from Anza (release.solana.com was
      # decommissioned). The install script writes to
      # ~/.local/share/solana/install/active_release/bin which we add
      # to PATH for subsequent steps.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Cache the compiled anchor-cli binary across runs — building it
      # from source takes ~5 minutes; a cache hit drops that to ~2s.
      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_TAG }}-${{ runner.os }}

      - name: Install Anchor CLI (build from source)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag "${ANCHOR_TAG}" \
            anchor-cli \
            --locked \
            --force

      - name: Verify tool versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: Anchor build
        run: anchor build

      - name: Cargo test (workspace programs)
        run: cargo test

  web:
    name: Web typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: nodosol
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_USDC_MINT: Gh9ZwEmdLJ8DscKNTkTqPbNwLNNBjuSzaG9Vp2KGtKJr
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-ci
          SOLANA_RPC_URL: https://api.devnet.solana.com
