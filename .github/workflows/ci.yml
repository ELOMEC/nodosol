name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Anchor build + program tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: metaDAOproject/setup-anchor@v1
        with:
          anchor-version: "0.31.1"
          solana-cli-version: "2.2.21"
          node-version: "22.11.0"

      - name: Anchor build
        run: anchor build

      - name: Cargo test (workspace programs)
        run: cargo test

  web:
    name: Web typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: nodosol
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_USDC_MINT: Gh9ZwEmdLJ8DscKNTkTqPbNwLNNBjuSzaG9Vp2KGtKJr
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-ci
          SOLANA_RPC_URL: https://api.devnet.solana.com
