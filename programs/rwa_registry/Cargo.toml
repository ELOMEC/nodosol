[package]
name = "rwa_registry"
version = "0.1.0"
description = "Nodosol RWA issuer registry — tracks licenced issuers and their asset class permissions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.1"
solana-security-txt = "1.1.2"

[dev-dependencies]
litesvm = "0.11.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-clock = "3.0.0"


[lints]
workspace = true
