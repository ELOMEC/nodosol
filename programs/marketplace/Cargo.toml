[package]
name = "marketplace"
version = "0.1.0"
description = "Nodosol marketplace — on-chain listings and buys for tokenised RWA assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.1", features = ["token_2022"] }
solana-security-txt = "1.1.2"

[dev-dependencies]
litesvm = "0.11.0"
litesvm-token = { version = "0.11.0", features = ["token-2022"] }
anchor-spl = { version = "1.0.1", features = ["token_2022"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-clock = "3.0.0"


[lints]
workspace = true
