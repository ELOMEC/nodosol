[package]
name = "auctions"
version = "0.1.0"
description = "Nodosol sealed-bid auction primitive — commit/reveal bidding on USDC, reusable for tickets, RWA, and real-estate rentals"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "auctions"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = { version = "1.0.0", features = ["token_2022"] }
solana-security-txt = "1.1.1"
solana-program = "2"

[dev-dependencies]
litesvm = "0.11.0"
litesvm-token = { version = "0.11.0", features = ["token-2022"] }
anchor-spl = { version = "1.0.0", features = ["token_2022"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-clock = "3.0.0"
sha3 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
